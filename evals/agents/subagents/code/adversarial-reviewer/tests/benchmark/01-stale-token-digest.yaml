id: adversarial-reviewer-stale-token-digest
name: "Adversarial reviewer benchmark: stale token digest"
description: Detects renewal that leaves the old token digest active.
category: developer
prompt: |
  Read only evals/fixtures/reviewer-benchmark/stale-token-digest.ts. Treat it as the exact changed-file scope. Review it for concrete correctness and security failures. Include exact symbol names in findings. End with a final line containing exactly SHIP or REQUEST CHANGES.
approvalStrategy: { type: auto-approve }
behavior:
  mustUseTools: [read]
  mustNotUseTools: [bash, edit, write, task]
  minToolCalls: 1
  maxToolCalls: 8
  expectedResponse:
    contains: [tokenDigest, REQUEST CHANGES]
timeout: 240000
tags: [reviewer-benchmark, known-defect, security]
