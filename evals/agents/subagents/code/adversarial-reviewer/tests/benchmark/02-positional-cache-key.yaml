id: adversarial-reviewer-positional-cache-key
name: "Adversarial reviewer benchmark: positional cache identity"
description: Detects cross-session and positional cache identity collisions.
category: developer
prompt: |
  Read only evals/fixtures/reviewer-benchmark/positional-cache-key.ts. Treat it as the exact changed-file scope. Review it for concrete correctness and isolation failures. Include exact symbol names in findings. End with a final line containing exactly SHIP or REQUEST CHANGES.
approvalStrategy: { type: auto-approve }
behavior:
  mustUseTools: [read]
  mustNotUseTools: [bash, edit, write, task]
  minToolCalls: 1
  maxToolCalls: 8
  expectedResponse:
    contains: [sessionKey]
    finalLine: REQUEST CHANGES
timeout: 240000
tags: [reviewer-benchmark, known-defect, isolation]
